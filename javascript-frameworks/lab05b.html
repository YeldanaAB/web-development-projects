
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab05 - Problem 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Colors */
        :root {
            --pink: #f3dce4;
            --rose: #b77b91;
            --cream: #fffaf2;
            --gold: #c6a36a;
            --brown: #654a53;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f7, #f3dce4, #e8d5e8);
            color: var(--brown);
            font-family: 'Crimson Text', serif;
        }

        #root {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        /* Clock */
        .clock {
            width: 100%;
            max-width: 1100px;
            min-height: 70vh;
            padding: 45px 25px;
            background: var(--cream);
            border: 3px double var(--gold);
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(101, 74, 83, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .clock::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid var(--gold);
            border-radius: 25px;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 35px;
            color: var(--rose);
            font-family: 'Redaction 35', serif;
            font-size: clamp(25px, 4vw, 42px);
            font-weight: normal;
            font-style: normal;
            letter-spacing: 2px;
        }

        .time {
            color: var(--brown);
            font-family: 'Redaction 35', serif;
            font-size: clamp(38px, 10vw, 140px);
            font-weight: normal;
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
            text-shadow: 2px 2px 0 var(--pink);
        }

        .date {
            margin-top: 30px;
            padding: 12px 25px;
            color: var(--rose);
            border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
            font-family: 'Crimson Text', serif;
            font-size: clamp(14px, 2vw, 21px);
            font-style: normal;
        }
        /* Footer */
        footer {
            padding: 20px;
            color: var(--brown);
            font-family: 'Crimson Text', serif;
            font-size: 17px;
            text-align: center;
        }

        footer p {
            margin: 0;
        }
        
        /* Mobile */
        @media (max-width: 600px) {
            .clock {
                min-height: 65vh;
                padding: 30px 15px;
            }

            .time {
                font-size: clamp(34px, 9vw, 65px);
            }

            .date {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <footer>
        <p>Made by Yeldana Bolatzhan.</p>
    </footer>

    <!-- Load React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Load Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function Clock() {
            const [time, setTime] = React.useState(new Date());
            React.useEffect(function () {
                const timer = setInterval(function () {
                    setTime(new Date());
                }, 1000);

                return function () {
                    clearInterval(timer);
                };
            }, []);

            const hours = String(time.getHours()).padStart(2, "0");
            const minutes = String(time.getMinutes()).padStart(2, "0");
            const seconds = String(time.getSeconds()).padStart(2, "0");
            const currentTime = hours + ":" + minutes + ":" + seconds;
            const currentDate = time.toLocaleDateString("en-CA", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

            return (
                <div className="clock">
                    <h1>Digital Clock</h1>
                    <div className="time">{currentTime}</div>
                    <div className="date">{currentDate}</div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<Clock />);
    </script>
</body>
</html>
